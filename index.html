<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ULTRON Neural Core</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020308;
}

#ui{
    position:fixed;
    top:20px;
    width:100%;
    text-align:center;
    color:#ffd84a;
    font-family:Arial;
    letter-spacing:6px;
    font-size:28px;
    text-shadow:0 0 15px #ffae00;
    z-index:5;
}

#status{
    position:fixed;
    bottom:25px;
    width:100%;
    text-align:center;
    color:#ffd84a;
    font-family:Arial;
    font-size:14px;
    z-index:5;
}
</style>
</head>

<body>

<div id="ui">ULTRON AI NEURAL CORE</div>
<div id="status">NEURAL NETWORK ONLINE</div>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.z = 8;

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    alpha:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(renderer.domElement);


/* =========================
   CENTRAL AI CORE
========================= */

const coreGeometry =
new THREE.IcosahedronGeometry(1.2,3);

const coreMaterial =
new THREE.MeshBasicMaterial({
    color:0xffd000,
    wireframe:true
});

const core =
new THREE.Mesh(
    coreGeometry,
    coreMaterial
);

scene.add(core);


/* CORE GLOW */

const glowGeometry =
new THREE.SphereGeometry(1.4,32,32);

const glowMaterial =
new THREE.MeshBasicMaterial({
    color:0xffa000,
    transparent:true,
    opacity:0.12
});

const glow =
new THREE.Mesh(
    glowGeometry,
    glowMaterial
);

scene.add(glow);


/* =========================
   NEURAL NODES
========================= */

const nodes = [];

const nodeGeometry =
new THREE.SphereGeometry(
    0.035,
    8,
    8
);

const nodeMaterial =
new THREE.MeshBasicMaterial({
    color:0xffd84a
});


for(let i=0;i<250;i++){

    const angle =
    Math.random()*Math.PI*2;

    const radius =
    1.7 + Math.random()*2.5;

    const y =
    (Math.random()-0.5)*4;

    const x =
    Math.cos(angle)*radius;

    const z =
    Math.sin(angle)*radius;

    const node =
    new THREE.Mesh(
        nodeGeometry,
        nodeMaterial
    );

    node.position.set(
        x,
        y,
        z
    );

    scene.add(node);

    nodes.push(node);
}


/* =========================
   NEURAL CONNECTIONS
========================= */

const lineMaterial =
new THREE.LineBasicMaterial({
    color:0xffb300,
    transparent:true,
    opacity:0.25
});


for(let i=0;i<nodes.length;i++){

    /* Connect random nearby nodes */

    for(let j=0;j<2;j++){

        const target =
        nodes[
            Math.floor(
                Math.random()*nodes.length
            )
        ];

        const points = [

            nodes[i].position,

            target.position

        ];

        const geometry =
        new THREE.BufferGeometry()
        .setFromPoints(points);

        const line =
        new THREE.Line(
            geometry,
            lineMaterial
        );

        scene.add(line);

    }
}


/* =========================
   ENERGY PARTICLES
========================= */

const particleGeometry =
new THREE.BufferGeometry();

const particlePositions = [];

for(let i=0;i<500;i++){

    particlePositions.push(

        (Math.random()-0.5)*8,

        (Math.random()-0.5)*8,

        (Math.random()-0.5)*8

    );

}

particleGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        particlePositions,
        3
    )
);

const particleMaterial =
new THREE.PointsMaterial({

    color:0xffd84a,

    size:0.025,

    transparent:true,

    opacity:0.7

});

const particles =
new THREE.Points(
    particleGeometry,
    particleMaterial
);

scene.add(particles);


/* =========================
   ANIMATION
========================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    /* Rotate neural system */

    scene.rotation.y += 0.002;

    scene.rotation.x =
    Math.sin(
        Date.now()*0.0003
    )*0.05;


    /* Core rotation */

    core.rotation.x += 0.01;

    core.rotation.y += 0.015;


    /* Core pulse */

    const pulse =
    1 +
    Math.sin(
        Date.now()*0.003
    )*0.08;

    core.scale.set(
        pulse,
        pulse,
        pulse
    );

    glow.scale.set(
        pulse,
        pulse,
        pulse
    );


    /* Energy particle movement */

    particles.rotation.y += 0.004;


    renderer.render(
        scene,
        camera
    );

}

animate();


/* =========================
   RESIZE
========================= */

window.addEventListener(
"resize",
function(){

    camera.aspect =
    window.innerWidth /
    window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>

</body>
</html>
