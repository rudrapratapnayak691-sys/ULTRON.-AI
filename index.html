<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>ULTRON AI V3</title>

<link rel="stylesheet"
href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

</head>


<body>

<div id="title">
ULTRON
</div>


<div id="response">
NEURAL CORE ONLINE
</div>


<div id="status">
SYSTEM READY
</div>


<video id="camera"
autoplay
playsinline
muted>
</video>


<div id="typingPanel">

<input
id="questionInput"
type="text"
placeholder="Ask ULTRON anything..."
autocomplete="off">

<button onclick="sendTypedQuestion()">
SEND
</button>

</div>


<div class="buttons">

<button
onclick="toggleHandTracking()"
id="handButton">

✋ HAND: OFF

</button>


<button
onclick="toggleTouchMode()"
id="touchButton">

👆 TOUCH: OFF

</button>


<button onclick="startVoice()">

🎤 VOICE

</button>


<button onclick="toggleTyping()">

⌨️ TYPE

</button>


<button onclick="resetBrain()">

🔄 RESET

</button>

</div>


<script src="script.js"></script>

</body>

</html>
