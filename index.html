<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>ULTRON MARK 10</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

</head>

<body>

<div id="title">
ULTRON MARK 10
</div>

<div id="response">
NEURAL CORE ONLINE
</div>

<div id="status">
MARK 10 READY
</div>

<video id="camera"
autoplay
playsinline
muted>
</video>

<div id="typingPanel">

<input
id="questionInput"
placeholder="Ask ULTRON MARK 10...">

<button id="sendButton">
SEND
</button>

</div>

<div class="buttons">

<button id="handButton">
✋ HAND OFF
</button>

<button id="touchButton">
👆 TOUCH OFF
</button>

<button id="voiceButton">
🎤 VOICE
</button>

<button id="typeButton">
⌨️ TYPE
</button>

<button id="resetButton">
🔄 RESET
</button>

</div>

<script src="script.js"></script>

</body>
</html>
