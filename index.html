<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
  >

  <title>ULTRON MARK 12</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="hud">

    <div class="topbar">
      <div class="logo">
        ULTRON <span>MARK 12</span>
      </div>

      <div id="status">
        NEURAL SYSTEM ONLINE
      </div>
    </div>

    <!-- 3D Neural Network -->
    <canvas id="neuralCanvas"></canvas>

    <!-- Left System Panel -->
    <div class="panel left-panel">

      <div class="panel-title">
        NEURAL CORE
      </div>

      <div class="line"></div>

      <div>
        NETWORK:
        <b id="networkStatus">ACTIVE</b>
      </div>

      <div>
        NEURONS:
        <b id="neuronCount">0</b>
      </div>

      <div>
        SIGNALS:
        <b id="signalCount">0</b>
      </div>

      <div>
        PROCESSING:
        <b id="processing">IDLE</b>
      </div>

    </div>

    <!-- Right System Panel -->
    <div class="panel right-panel">

      <div class="panel-title">
        SYSTEM
      </div>

      <div class="line"></div>

      <div>
        VOICE:
        <b id="voiceStatus">READY</b>
      </div>

      <div>
        HAND TRACKING:
        <b>READY</b>
      </div>

      <div>
        CORE:
        <b>STABLE</b>
      </div>

    </div>

    <!-- AI Response -->
    <div id="response">
      <span>ULTRON:</span>
      Neural system ready, Boss.
    </div>

    <!-- Command Input -->
    <div class="command-box">

      <button id="micButton">
        🎤
      </button>

      <input
        id="commandInput"
        type="text"
        placeholder="Speak or type a command..."
      >

      <button id="sendButton">
        ➤
      </button>

    </div>

    <!-- Quick Launch -->
    <div class="quick-buttons">

      <button data-site="youtube">
        YouTube
      </button>

      <button data-site="google">
        Google
      </button>

      <button data-site="whatsapp">
        WhatsApp
      </button>

      <button data-site="roblox">
        Roblox
      </button>

      <button data-site="instagram">
        Instagram
      </button>

      <button data-site="chatgpt">
        ChatGPT
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
