<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ULTRON MARK 12</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <h1>ULTRON MARK 12</h1>
        <p>ULTRON MARK 12: NEURAL CORE ONLINE</p>
    </header>

    <main>

        <div id="neuralCore">

            <div class="energyRing ring1"></div>
            <div class="energyRing ring2"></div>
            <div class="energyRing ring3"></div>

            <div class="coreGlow"></div>

            <div id="neurons"></div>

            <div class="core">
                <div class="corePulse"></div>
                <span>U</span>
            </div>

        </div>

        <div id="status">
            MARK 12 READY
        </div>

        <div id="response">
            Awaiting command...
        </div>

    </main>

    <div class="controls">

        <button onclick="toggleHand()">
            👋 HAND OFF
        </button>

        <button onclick="toggleTouch()">
            ☝️ TOUCH OFF
        </button>

        <button onclick="startVoice()">
            🎙️ VOICE
        </button>

        <button onclick="typeCommand()">
            ⌨️ TYPE
        </button>

        <button onclick="resetUltron()">
            🔄 RESET
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
